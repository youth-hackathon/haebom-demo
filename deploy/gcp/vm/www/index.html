<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해봄 기기</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#16181d; --muted:#667085; --line:#e3e6eb; --accent:#1f6feb; --danger:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1a1d23; --fg:#e8eaee; --muted:#98a2b3; --line:#2a2f38; --accent:#5b9dff; --danger:#ef6b6b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  ul { list-style:none; padding:0; margin:0 0 16px; display:grid; gap:10px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:12px; }
  li .name { font-weight:600; } li .meta { color:var(--muted); font-size:13px; }
  li .grow { flex:1; min-width:0; }
  a.btn, button { font:inherit; border-radius:8px; padding:8px 14px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; text-decoration:none; white-space:nowrap; }
  a.btn.primary, button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  #status { color:var(--muted); font-size:14px; min-height:1.5em; margin-top:10px; }
  .empty { color:var(--muted); padding:20px 0; }
</style>
</head>
<body>
<main>
  <h1>해봄 기기</h1>
  <p class="sub">기기는 필요할 때 만들고, 다 쓰면 지워 주세요. 만드는 데 1분쯤 걸립니다. 지우면 기기 안의 내용은 사라집니다.</p>
  <ul id="list"></ul>
  <button id="create" class="primary">새 기기 만들기</button>
  <div id="status"></div>
</main>
<script>
// 기기 수를 4대로 고정해 쓰는 동안은 만들기·지우기 버튼을 숨깁니다. true로 바꾸면 다시 나옵니다.
const DYNAMIC = false;
const MAX = 4;
// 주소에 아이디와 비밀번호를 넣어 연 경우 상대 경로 fetch가 막히므로 절대 주소를 씁니다.
const API = location.origin + '/haebom/api/';
const list = document.getElementById('list'), btn = document.getElementById('create'), status = document.getElementById('status');
let creating = false, groups = 0, running = 0;
async function refresh() {
  try {
    const r = await fetch(API + 'cvds', { cache: 'no-store' });
    const cvds = (await r.json()).cvds || [];
    groups = new Set(cvds.map(c => c.group)).size;
    running = cvds.filter(c => c.status === 'Running').length;
    list.replaceChildren(...cvds.map(c => {
      const li = document.createElement('li');
      const info = document.createElement('div'); info.className = 'grow';
      const name = document.createElement('div'); name.className = 'name'; name.textContent = c.webrtc_device_id;
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = (c.status === 'Running' ? '켜짐' : c.status === 'Starting' ? '켜는 중' : c.status) + ' · ' + (c.displays || []).join(', ');
      info.append(name, meta);
      const open = document.createElement('a'); open.className = 'btn primary'; open.textContent = '열기';
      open.href = '/devices/' + encodeURIComponent(c.webrtc_device_id) + '/files/client.html';
      const del = document.createElement('button'); del.className = 'danger'; del.textContent = '지우기';
      del.onclick = async () => {
        if (!confirm(c.webrtc_device_id + ' 기기를 지울까요? 기기 안의 내용이 사라집니다.')) return;
        del.disabled = true; status.textContent = '지우는 중…';
        await fetch(API + 'delete/' + c.group, { method: 'POST' });
        setTimeout(() => { status.textContent = ''; refresh(); }, 4000);
      };
      li.append(info, open); if (DYNAMIC) li.append(del); return li;
    }));
    if (!cvds.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = '켜져 있는 기기가 없습니다.'; list.append(d); }
    btn.disabled = creating || groups >= MAX;
    if (DYNAMIC && !creating && groups >= MAX) status.textContent = '기기는 ' + MAX + '대까지 만들 수 있습니다. 안 쓰는 기기를 지워 주세요.';
  } catch (e) { status.textContent = '목록을 불러오지 못했습니다.'; }
}
btn.onclick = async () => {
  creating = true; btn.disabled = true; const before = running; const t0 = Date.now();
  status.textContent = '기기를 만드는 중… (1분쯤 걸립니다)';
  try { await fetch(API + 'create', { method: 'POST' }); } catch (e) {}
  const timer = setInterval(async () => {
    await refresh();
    if (running > before || Date.now() - t0 > 180000) {
      clearInterval(timer); creating = false;
      status.textContent = running > before ? '기기가 준비됐습니다. 한국어 설정이 적용되는 동안 화면이 한 번 다시 시작될 수 있습니다.' : '기기를 만들지 못했습니다. 다시 시도해 주세요.';
      refresh();
    }
  }, 4000);
};
if (!DYNAMIC) { btn.hidden = true; document.querySelector('p.sub').textContent = '쓸 기기의 "열기"를 누르세요. 한 기기를 여러 사람이 열면 같은 화면을 함께 보고 조작하게 됩니다.'; }
refresh(); setInterval(() => { if (!creating) refresh(); }, 10000);
</script>
</body>
</html>
