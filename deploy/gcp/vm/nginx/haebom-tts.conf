# 외부의 폰이 http로 TTS 서버에 닿는 문입니다. 서버에 인증이 없으므로 주소 안의 비밀 경로가 열쇠 노릇을 합니다.
#   http://<공개 IP>:6081/__TTS_TOKEN__/tts  →  127.0.0.1:8766/tts
# 비밀 경로가 틀리면 404만 돌려줍니다.
server {
    listen 6081;
    server_name _;
    client_max_body_size 21m;          # STT는 20MiB까지 받습니다
    access_log /var/log/nginx/haebom-tts.access.log haebom_notoken;
    location /__TTS_TOKEN__/ {
        proxy_pass http://127.0.0.1:8766/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # /stt/live (WebSocket)
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;                           # /tts/stream 은 조각이 오는 대로 내보냅니다
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / { return 404; }
}
