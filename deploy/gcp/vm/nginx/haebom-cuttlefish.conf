# 밖으로 여는 것은 이 서버뿐입니다. 모든 경로에 비밀번호가 걸립니다.
#   /haebom/            기기 목록과 "새 기기 만들기" 화면
#   /haebom/api/...     Host Orchestrator(127.0.0.1:2080)의 일부만: 목록, 만들기(고정된 사양), 지우기
#   그 밖               Cuttlefish operator(127.0.0.1:1080): 기기 화면과 WebRTC 신호
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 6080;
    server_name _;
    auth_basic "haebom";
    auth_basic_user_file /etc/nginx/haebom.htpasswd;

    location = / { return 302 /haebom/; }
    location /haebom/ {
        alias /var/www/haebom/;
        index index.html;
        add_header Cache-Control "no-store";
    }
    location = /haebom/api/cvds {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:2080/cvds;
    }
    # 기기 수를 고정해 쓰는 동안은 만들기·지우기를 막아 둡니다(아래 두 곳의 'return 403;'을 지우면 다시 열림).
    # 만들기: 요청의 본문은 버리고 VM에 있는 고정된 사양만 보냅니다.
    location = /haebom/api/create {
        return 403;
        limit_except POST { deny all; }
        proxy_method POST;
        proxy_set_header Content-Type application/json;
        proxy_set_body '__CREATE_JSON__';
        proxy_pass http://127.0.0.1:2080/cvds;
    }
    location ~ ^/haebom/api/delete/(cvd_[0-9]+)$ {
        return 403;
        limit_except POST { deny all; }
        proxy_method DELETE;
        proxy_pass http://127.0.0.1:2080/cvds/$1;
    }
    location / {
        # client.html에 조정 스크립트를 끼워 넣습니다(압축된 응답에는 못 넣으므로 압축을 끕니다).
        proxy_set_header Accept-Encoding "";
        sub_filter '<head>' '<head><script src="/haebom/tune.js"></script>';
        sub_filter_once on;
        proxy_pass http://127.0.0.1:1080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
